name: EIDT Maharashtra CI Quality Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-secrets:
    name: Security & Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Secret and Security Scanner
        run: |
          python scripts/security_audit.py

  backend-tests:
    name: Backend Tests & Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Validate Database Migrations (Isolated SQLite/Postgres)
        run: |
          python backend/database/migrate.py --status
          python backend/database/migrate.py

      - name: Verify Maharashtra Geographic Hierarchy Seeding
        run: |
          python -c "from app.database import SessionLocal; from app.services.geo_hierarchy import seed_maharashtra_hierarchy; db=SessionLocal(); res=seed_maharashtra_hierarchy(db); print('Hierarchy seeded:', res)"
        env:
          PYTHONPATH: backend

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests/ -v --tb=short
        env:
          PYTHONPATH: backend
          ALLOW_DEMO_FALLBACK: "true"

      - name: Test Database Backup & Restore Procedure
        run: |
          python scripts/backup_db.py
          python scripts/restore_db.py

  frontend-build:
    name: Frontend Dependency Check & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Distribution
        working-directory: frontend
        run: npm run build

      - name: Verify Production Distribution Integrity
        run: |
          test -f frontend/dist/index.html || exit 1
          echo "Frontend production artifact built successfully."
