# =========================================================================
# Nginx Configuration — Earth Intelligence Digital Twin (EIDT) Maharashtra
# Production Reverse Proxy, Gzip Compression, Security Headers & API Routing
# =========================================================================

server {
    listen 80;
    server_name localhost;

    # Root directory for static production bundle
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.tile.opentopomap.org https://basemaps.cartocdn.com; connect-src 'self' http://localhost:8000 https: ws:;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend SPA routing (falls back to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache policy
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Proxy /api requests to FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Proxy static data / rasters if mounted
    location /static/data/ {
        proxy_pass http://backend:8000/static/data/;
        proxy_set_header Host $host;
    }

    # Healthcheck endpoint
    location /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
